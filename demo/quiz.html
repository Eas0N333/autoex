<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随堂练习 · 在线题库</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f6fb;
    color: #14171f;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
  }
  .shell { max-width: 1040px; margin: 0 auto; padding: 40px 32px 72px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; background: #2f6bff; color: #fff;
    display: grid; place-items: center; font-size: 22px; font-weight: 700;
  }
  .brand h1 { font-size: 22px; margin: 0; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: #6b7280; }
  .badge { font-size: 13px; color: #2f6bff; background: #e8efff; border-radius: 999px; padding: 6px 14px; }
  .progress { display: flex; gap: 8px; margin: 30px 0 18px; }
  .dot { height: 6px; flex: 1; border-radius: 999px; background: #dfe4ee; }
  .dot.on { background: #2f6bff; }
  .card {
    background: #fff; border-radius: 20px; padding: 40px 44px 36px;
    box-shadow: 0 18px 50px rgba(28, 39, 76, .08);
  }
  .meta { display: flex; gap: 10px; align-items: center; font-size: 14px; color: #6b7280; margin-bottom: 22px; }
  .chip { background: #eef2ff; color: #3555c9; border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .stem { font-size: 30px; line-height: 1.65; font-weight: 600; margin: 0 0 30px; letter-spacing: .2px; }
  .options { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  .option {
    display: flex; align-items: center; gap: 14px; padding: 18px 20px; border: 2px solid #e3e8f2;
    border-radius: 14px; font-size: 21px; background: #fff; cursor: pointer; text-align: left;
    transition: border-color .15s, background .15s;
  }
  .option:hover { border-color: #b7c8f5; }
  .option.sel { border-color: #2f6bff; background: #eef3ff; }
  .key {
    width: 34px; height: 34px; flex: none; border-radius: 50%; background: #f0f3f9;
    display: grid; place-items: center; font-size: 16px; color: #4b5563; font-weight: 700;
  }
  .option.sel .key { background: #2f6bff; color: #fff; }
  .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 32px; gap: 16px; }
  .hint { font-size: 14px; color: #8b93a3; }
  .btn {
    border: 0; border-radius: 12px; padding: 14px 26px; font-size: 16px; font-weight: 600;
    cursor: pointer; background: #2f6bff; color: #fff;
  }
  .btn.ghost { background: #f0f3f9; color: #374151; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  footer { margin-top: 26px; font-size: 13px; color: #8b93a3; text-align: center; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="logo">题</div>
      <div>
        <h1>随堂练习</h1>
        <p>高中数学 · 第 1 章 函数与数列</p>
      </div>
    </div>
    <span class="badge" id="counter">1 / 4</span>
  </header>

  <div class="progress" id="progress"></div>

  <main class="card">
    <div class="meta">
      <span class="chip" id="subject">数学</span>
      <span id="type">选择题</span>
      <span>·</span>
      <span>单选题</span>
    </div>
    <p class="stem" id="stem">已知函数 f(x)=x^2-4x+3，求 f(x) 的最小值。</p>
    <div class="options" id="options"></div>
    <div class="actions">
      <span class="hint" id="hint">选择答案后可直接看解析</span>
      <div>
        <button class="btn ghost" id="prev" type="button">上一题</button>
        <button class="btn" id="next" type="button">下一题</button>
      </div>
    </div>
  </main>
  <footer>演示页面：在这里切题，悬浮窗会自动识别并解答。配置 API Key 后为真实答案。</footer>
</div>

<script>
  const QUESTIONS = [
    {
      subject: '数学', type: '选择题',
      stem: '已知函数 f(x)=x^2-4x+3，求 f(x) 的最小值。',
      options: ['-1', '0', '1', '3'],
    },
    {
      subject: '数学', type: '选择题',
      stem: '计算 1+2+3+…+100 的和。',
      options: ['5050', '5000', '10100', '4950'],
    },
    {
      subject: '物理', type: '选择题',
      stem: '物体从静止开始自由下落 2 秒（g 取 10 m/s²），下落高度是多少？',
      options: ['10 m', '20 m', '40 m', '5 m'],
    },
    {
      subject: '化学', type: '选择题',
      stem: '0.01 mol/L 盐酸溶液的 pH 是多少？',
      options: ['1', '2', '7', '12'],
    },
  ];

  let index = 0;
  let selected = null;

  const els = {
    counter: document.getElementById('counter'),
    progress: document.getElementById('progress'),
    subject: document.getElementById('subject'),
    type: document.getElementById('type'),
    stem: document.getElementById('stem'),
    options: document.getElementById('options'),
    hint: document.getElementById('hint'),
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
  };

  function render() {
    const q = QUESTIONS[index];
    els.counter.textContent = `${index + 1} / ${QUESTIONS.length}`;
    els.subject.textContent = q.subject;
    els.type.textContent = q.type;
    els.stem.textContent = q.stem;
    els.options.innerHTML = '';
    q.options.forEach((text, i) => {
      const label = String.fromCharCode(65 + i);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'option';
      button.innerHTML = `<span class="key">${label}</span><span>${text}</span>`;
      button.addEventListener('click', () => {
        selected = label;
        [...els.options.children].forEach((el) => el.classList.remove('sel'));
        button.classList.add('sel');
        els.hint.textContent = `已选择 ${label}（演示页面，不判定对错）`;
      });
      els.options.append(button);
    });
    selected = null;
    els.hint.textContent = '选择答案后可直接看解析';
    els.prev.disabled = index === 0;
    els.next.textContent = index === QUESTIONS.length - 1 ? '重新开始' : '下一题';
    els.progress.innerHTML = QUESTIONS.map((_, i) => `<span class="dot${i <= index ? ' on' : ''}"></span>`).join('');
    document.title = `随堂练习 · ${q.subject}（${index + 1}/${QUESTIONS.length}）`;
  }

  els.next.addEventListener('click', () => {
    index = index === QUESTIONS.length - 1 ? 0 : index + 1;
    render();
  });
  els.prev.addEventListener('click', () => {
    if (index > 0) {
      index -= 1;
      render();
    }
  });

  render();
</script>
</body>
</html>
